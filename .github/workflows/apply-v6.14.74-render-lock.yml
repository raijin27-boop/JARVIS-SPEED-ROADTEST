name: Apply v6.14.74 SAFE RENDER LOCK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.74-render-lock.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply render lock
        run: python3 tools/apply-v61474-render-lock.py
      - name: Syntax and safety gates
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq 'v6.14.74 SAFE RENDER LOCK' app.js
          grep -Fq 'const renderLat=renderRoutePose?.lat ?? jarvisFreeMotion.displayLat;' app.js
          grep -Fq "jarvisNavTrackingState==='TRACKING'" app.js
          ! grep -Fq 'jarvisFreeMotion.displayLat=renderLat' app.js
          grep -Fq 'app.js?v=v6.14.74-0150' index.html
          grep -Fq 'window.__JARVIS_ROAD_TEST_BUILD_ID="v6.14.74-ROADTEST-20260906T0150JST"' index.html
      - name: Commit runtime
        run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: exact route render from continuous progress v6.14.74'
          git push origin HEAD:main
