name: Apply v6.14.62 public rollback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.62.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 tools/apply-v662-public.py
      - run: |
          set -euo pipefail
          node --check app.js
          node --check road-test-ui.js
          grep -Fq 'const total=branch?26:19' app.js
          ! grep -Fq 'bendStart-approach' app.js
          grep -Fq "v6.14.62-ROADTEST-dev" app.js
      - run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: rollback v6.14.61 white-line regression in v6.14.62'
          git push origin HEAD:main
