name: Validate road-test app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate app.js
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' appfiles < <(find parts -maxdepth 1 -type f -name 'app.*.txt' -print0 | sort -z)
          : > app.js
          for ((i=0; i<${#appfiles[@]}; i++)); do
            cat "${appfiles[$i]}" >> app.js
            if (( i < ${#appfiles[@]} - 1 )); then printf '\n' >> app.js; fi
          done
          node --check app.js
          grep -q 'longitude:destination.lon' app.js
          if grep -q 'latitude:destination.lat,longitude:endPt.lng' app.js; then
            echo 'STALE_DESTINATION_LONGITUDE_BUG_FOUND'
            exit 1
          fi
          echo "APP_JS_VALID $(git hash-object app.js)"
