name: Apply v6.14.67 reroute response
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.67-reroute.yml']
permissions:
  contents: write
jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply reroute-only patch
        run: python3 tools/apply-v667-reroute.py
      - name: Syntax and structural gates
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq 'const decisiveHeading=' app.js
          grep -Fq 'const confirmFixes=decisiveHeading?3:4' app.js
          grep -Fq 'v6.14.67-ROADTEST-20260906T0055JST' index.html
      - name: Commit runtime
        run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: stronger route deviation response v6.14.67'
          git push origin HEAD:main
