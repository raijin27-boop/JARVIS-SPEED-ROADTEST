name: Apply v6.14.60 public white-line tuning
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v6.14.60.yml'
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply-v660-public.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check app.js
          node --check road-test-ui.js
          grep -Fq "kind==='MERGE'" app.js
          grep -Fq "const total=branch?26:19" app.js
          grep -Fq "total*(2/3)" app.js
          grep -Fq "v6.14.60-ROADTEST-dev" app.js
      - name: Commit runtime
        run: |
          git config user.name 'jarvis-speed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'fix: shorten maneuver lines and show merges v6.14.60'
          git push origin HEAD:main
