name: Apply v6.14.78 VISUAL PRIORITY BYPASS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.78-visual-priority-bypass.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply patch
        run: python3 tools/apply-v61478-visual-priority-bypass.py
      - name: Syntax and behavior gates
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq 'v6.14.78 VISUAL PRIORITY BYPASS' app.js
          grep -Fq "navMode!=='ROUTE'||jarvisVisualGpsPriority||jarvisDeviationEscape" app.js
          grep -Fq 'app.js?v=v6.14.78-0325' index.html
          grep -Fq 'window.__JARVIS_ROAD_TEST_BUILD_ID="v6.14.78-ROADTEST-20260906T0325JST"' index.html
      - name: Commit runtime
        run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: bypass route target when visual GPS priority owns marker v6.14.78'
          git push origin HEAD:main
