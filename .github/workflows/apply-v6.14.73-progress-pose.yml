name: Apply v6.14.73 PROGRESS POSE
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.73-progress-pose.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply progress pose
        run: python3 tools/apply-v61473-progress-pose.py
      - name: Syntax and structural gates
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq 'v6.14.73 PROGRESS POSE' app.js
          grep -Fq 'jarvisMotion.displayS' app.js
          grep -Fq 'app.js?v=v6.14.73-0130' index.html
          grep -Fq 'window.__JARVIS_ROAD_TEST_BUILD_ID="v6.14.73-ROADTEST-20260906T0130JST"' index.html
      - name: Commit runtime
        run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: drive marker from stabilized route progress v6.14.73'
          git push origin HEAD:main
