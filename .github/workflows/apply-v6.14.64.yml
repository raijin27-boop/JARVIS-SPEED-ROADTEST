name: Apply v6.14.64 public persistent white-lines
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.64.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 tools/apply-v664-public.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check app.js
          node --check road-test-ui.js
          grep -Fq 'function jarvisPreviewManeuverEvents()' app.js
          grep -Fq "(!routePreviewActive&&!navSessionStarted)" app.js
          grep -Fq "source:'PREVIEW_RESCUE'" app.js
          grep -Fq 'v6.14.64-ROADTEST-dev' app.js
          grep -Fq 'v6.14.64-ROADTEST-20260905T1854JST' index.html
      - run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: keep all route arrows visible after START v6.14.64'
          git push origin HEAD:main
