name: Apply v6.14.72 SMOOTH ADHESION
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.72-smooth-adhesion.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply smooth adhesion
        run: python3 tools/apply-v61472-smooth-adhesion.py
      - name: Syntax and structural gates
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq 'SMOOTH ADHESION' app.js
          ! grep -Fq 'jarvisFreeMotion.displayLat=d.lat;jarvisFreeMotion.displayLon=d.lng;' app.js
          grep -Fq 'app.js?v=v6.14.72-0118' index.html
          grep -Fq 'window.__JARVIS_ROAD_TEST_BUILD_ID="v6.14.72-ROADTEST-20260906T0118JST"' index.html
      - name: Commit runtime
        run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: smooth strong route adhesion and cache bust v6.14.72'
          git push origin HEAD:main
