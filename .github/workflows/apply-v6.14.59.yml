name: Apply v6.14.59 public maneuver preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v6.14.59.yml'
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply-v659-public.py
      - name: Syntax and structural gates
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check road-test-ui.js
          test "$(grep -c 'function jarvisRenderPreviewTurnArrows()' app.js)" -eq 1
          grep -q 'setTimeout(jarvisRenderPreviewTurnArrows,0);' app.js
          grep -Fq 'jarvisClearPreviewTurnArrows?.();' app.js
          grep -q "v6.14.59-ROADTEST-dev" app.js
          grep -q 'JARVIS Road Test v6.14.59-ROADTEST-20260905T1545JST' index.html
      - name: Commit v6.14.59
        run: |
          git config user.name 'jarvis-speed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'feat: preview all maneuver white lines before START v6.14.59'
          git push origin HEAD:main
