name: Sync v6.14.62 public canonical app
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-v6.14.62.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 tools/sync-v662-comment.py
      - run: |
          node --check app.js
          grep -Fq "v6.14.62-ROADTEST-dev" app.js
      - run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js
          git commit -m 'chore: sync public v6.14.62 app with canonical'
          git push origin HEAD:main
