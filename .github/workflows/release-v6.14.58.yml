name: Release v6.14.58 road-test metadata
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v6.14.58.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump verified road-test build metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[Path('app.js'),Path('index.html')]
          for p in files:
            s=p.read_text()
            s=s.replace("'v6.14.57-ROADTEST-dev'", "'v6.14.58-ROADTEST-dev'")
            s=s.replace('JARVIS Road Test v6.14.57-ROADTEST-20260904T222603Z','JARVIS Road Test v6.14.58-ROADTEST-20260905T1530JST')
            p.write_text(s)
          PY
          node --check app.js
          node --check road-test-ui.js
          grep -q "v6.14.58-ROADTEST-dev" app.js
          grep -q "v6.14.58-ROADTEST-20260905T1530JST" index.html
      - name: Commit v6.14.58 metadata
        run: |
          git config user.name 'jarvis-speed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'release: mark public road-test build v6.14.58'
          git push origin HEAD:main
