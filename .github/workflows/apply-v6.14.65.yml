name: Apply v6.14.65 public adhesion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.65.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 tools/apply-v665-public.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check app.js
          node --check road-test-ui.js
          grep -Fq 'function jarvisTrackingDisplayTargetV665' app.js
          grep -Fq 'strength=pr.distance<=18?.985' app.js
          grep -Fq 'autoRerouteOffRouteFixes>=4&&held>=2200' app.js
          grep -Fq 'return !!(navSessionStarted||running);' app.js
          grep -Fq 'v6.14.65-ROADTEST-dev' app.js
          grep -Fq 'v6.14.65-ROADTEST-20260905T2320JST' index.html
      - run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: strong route adhesion and wake lock v6.14.65'
          git push origin HEAD:main
