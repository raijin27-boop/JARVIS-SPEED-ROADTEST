name: Apply v6.14.66 public hard adhesion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.66.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Apply v6.14.66
        run: python3 tools/apply-v666-public.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check app.js
          node --check road-test-ui.js
          grep -Fq 'pr.distance<=45?1' app.js
          grep -Fq 'Math.max(58,Math.min(78,50+acc*1.35))' app.js
          grep -Fq 'autoRerouteOffRouteFixes>=6&&held>=4200' app.js
          grep -Fq 'data:video/mp4;base64' app.js
          grep -Fq 'v6.14.66-ROADTEST-dev' app.js
          grep -Fq 'v6.14.66-ROADTEST-20260905T2345JST' index.html
      - name: Commit public runtime
        run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: hard route adhesion and stronger wake fallback v6.14.66'
          git push origin HEAD:main
# retrigger after public reroute-block alignment
