name: Apply v6.14.79 SMOOTH VISUAL HANDOFF
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.79-smooth-visual-handoff.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply patch
        run: python3 tools/apply-v61479-smooth-visual-handoff.py
      - name: Syntax and behavior gates
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq 'v6.14.79 SMOOTH VISUAL HANDOFF' app.js
          grep -Fq 'jarvisVisualGpsPriorityStartedAt' app.js
          grep -Fq 'visualMs<700' app.js
          grep -Fq 'app.js?v=v6.14.79-0332' index.html
          grep -Fq 'window.__JARVIS_ROAD_TEST_BUILD_ID="v6.14.79-ROADTEST-20260906T0332JST"' index.html
      - name: Commit runtime
        run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: smooth marker handoff from route lock to live GPS v6.14.79'
          git push origin HEAD:main
