name: Deploy Claude JARVIS Road Test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Claude redesign and verify reports
        shell: bash
        run: |
          set -euo pipefail
          CLAUDE_SHA=01829760c7629dbda04796e83a1a791a3cb0bfb4
          BASE="https://raw.githubusercontent.com/raijin27-boop/JARVIS-SPEED/${CLAUDE_SHA}/v6.14.44-source"
          rm -rf _site _verify
          mkdir -p _site _verify

          curl -fsSL "$BASE/road-test-site/index.html" -o _site/index.html
          curl -fsSL "$BASE/road-test-site/app.js" -o _site/app.js
          curl -fsSL "$BASE/road-test-site/app.css" -o _site/app.css
          curl -fsSL "$BASE/road-test-site/road-test-ui.js" -o _site/road-test-ui.js
          curl -fsSL "$BASE/manifest.webmanifest" -o _site/manifest.webmanifest
          curl -fsSL "$BASE/icon-192.png" -o _site/icon-192.png
          curl -fsSL "$BASE/icon-512.png" -o _site/icon-512.png
          curl -fsSL "$BASE/test/reports/redesign-v654-tests.json" -o _verify/redesign-v654-tests.json
          touch _site/.nojekyll

          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('_verify/redesign-v654-tests.json','utf8'));
          if(!Array.isArray(r.results)||r.results.length!==8||!r.results.every(x=>x.pass===true)){
            throw new Error('Claude redesign regression report is not 8/8 pass');
          }
          console.log('CLAUDE_REDESIGN_REPORT_8_OF_8_OK');
          NODE

          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text()
          s=s.replace('v6.14.47-ROADTEST-20260904T191348Z','CLAUDE-v6.14.54-01829760')
          s=s.replace('<title>JARVIS Road Test CLAUDE-v6.14.54-01829760</title>','<title>JARVIS Claude v6.14.54 Road Test</title>')
          p.write_text(s)
          PY

          node --check _site/app.js
          node --check _site/road-test-ui.js
          grep -q 'CLAUDE-v6.14.54-01829760' _site/index.html
          grep -q 'jarvisCorridorMatch' _site/app.js
          grep -q 'jarvisCommitRoute' _site/app.js
          grep -q 'jarvisVerifyRouteRendered' _site/app.js
          grep -q 'jarvisWakeWanted' _site/app.js
          ! grep -q 'road-test-v652.js' _site/index.html
          ! grep -q 'road-test-v653.js' _site/index.html
          echo "CLAUDE_V654_PINNED_TEST_BUILD_OK"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
