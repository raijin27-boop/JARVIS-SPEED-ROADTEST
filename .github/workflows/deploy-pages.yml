name: Deploy Claude JARVIS Road Test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy verified Claude artifact unchanged
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site /tmp/claude-v654.zip
          mkdir -p _site
          curl -fsSL 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-c198-820b-add8-0ed4512b0fcd/raw?se=2026-09-04T19%3A57%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=c716c8b8-ba0d-5e1f-b988-16606309e115&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A16%3A45Z&ske=2026-09-05T03%3A16%3A45Z&sks=b&skv=2026-02-06&sig=RIQe6jLHWnWWzfznbVLnnHt%2BudWV64hV2B/b0GTAL/0%3D' -o /tmp/claude-v654.zip
          unzip -q /tmp/claude-v654.zip -d _site
          touch _site/.nojekyll
          node --check _site/app.js
          node --check _site/road-test-ui.js
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('_site/redesign-v654-tests.json','utf8'));
          if(!Array.isArray(r.results)||r.results.length!==8||!r.results.every(x=>x.pass===true)) throw new Error('Claude redesign report is not 8/8 pass');
          console.log('CLAUDE_REDESIGN_REPORT_8_OF_8_OK');
          NODE
          grep -q 'CLAUDE-v6.14.54-EXPORT' _site/index.html
          grep -q 'jarvisCorridorMatch' _site/app.js
          grep -q 'jarvisCommitRoute' _site/app.js
          grep -q 'jarvisVerifyRouteRendered' _site/app.js
          grep -q 'jarvisWakeWanted' _site/app.js
          ! grep -q 'road-test-v652.js' _site/index.html
          ! grep -q 'road-test-v653.js' _site/index.html
          echo 'CLAUDE_V654_ARTIFACT_READY'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
