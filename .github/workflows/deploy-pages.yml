name: Deploy Claude JARVIS Road Test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Claude redesign and run its regression suite
        shell: bash
        run: |
          set -euo pipefail
          CLAUDE_SHA=01829760c7629dbda04796e83a1a791a3cb0bfb4
          rm -rf _claude _site
          git init _claude
          git -C _claude remote add origin https://github.com/raijin27-boop/JARVIS-SPEED.git
          git -C _claude fetch --depth 1 origin "$CLAUDE_SHA"
          git -C _claude checkout --detach FETCH_HEAD

          node _claude/v6.14.44-source/test/run-suite.mjs

          mkdir -p _site
          cp _claude/v6.14.44-source/road-test-site/index.html _site/index.html
          cp _claude/v6.14.44-source/road-test-site/app.js _site/app.js
          cp _claude/v6.14.44-source/road-test-site/app.css _site/app.css
          cp _claude/v6.14.44-source/road-test-site/road-test-ui.js _site/road-test-ui.js
          cp _claude/v6.14.44-source/road-test-site/manifest.webmanifest _site/manifest.webmanifest 2>/dev/null || cp _claude/v6.14.44-source/manifest.webmanifest _site/manifest.webmanifest
          cp _claude/v6.14.44-source/road-test-site/icon-192.png _site/icon-192.png
          cp _claude/v6.14.44-source/road-test-site/icon-512.png _site/icon-512.png
          touch _site/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text()
          s=s.replace('v6.14.47-ROADTEST-20260904T191348Z','CLAUDE-v6.14.54-01829760')
          s=s.replace('<title>JARVIS Road Test CLAUDE-v6.14.54-01829760</title>','<title>JARVIS Claude v6.14.54 Road Test</title>')
          p.write_text(s)
          PY

          node --check _site/app.js
          node --check _site/road-test-ui.js
          grep -q 'CLAUDE-v6.14.54-01829760' _site/index.html
          grep -q 'jarvisCorridorMatch' _site/app.js
          grep -q 'jarvisCommitRoute' _site/app.js
          grep -q 'jarvisVerifyRouteRendered' _site/app.js
          grep -q 'jarvisWakeWanted' _site/app.js
          ! grep -q 'road-test-v652.js' _site/index.html
          ! grep -q 'road-test-v653.js' _site/index.html
          echo "CLAUDE_V654_PINNED_TEST_BUILD_OK"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
