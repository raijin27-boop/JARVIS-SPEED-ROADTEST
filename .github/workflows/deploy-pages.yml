name: Deploy JARVIS Road Test (canonical build)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble _site directly from the repo's own checked-in canonical files
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          for f in index.html app.js app.css road-test-ui.js icon-192.png icon-512.png; do
            cp "$f" "_site/$f"
          done
          touch _site/.nojekyll
      - name: Validate build
        run: |
          set -euo pipefail
          node --check _site/app.js
          node --check _site/road-test-ui.js
          echo 'JARVIS_ROADTEST_BUILD_OK'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
