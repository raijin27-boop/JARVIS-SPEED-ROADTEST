name: Deploy JARVIS v6.14.55 Road Test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current verified v6.14.54 public baseline
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          BASE='https://raijin27-boop.github.io/JARVIS-SPEED-ROADTEST'
          for f in index.html app.js app.css road-test-ui.js manifest.webmanifest icon-192.png icon-512.png redesign-v654-tests.json; do
            curl -fsSL "$BASE/$f?baseline=v654" -o "_site/$f"
          done
          grep -q 'CLAUDE-v6.14.54-EXPORT' _site/index.html
          grep -q 'jarvisCorridorMatch' _site/app.js
          grep -q 'jarvisCommitRoute' _site/app.js
      - name: Apply v6.14.55 targeted changes
        run: python tools/apply-v655-public.py
      - name: Validate v6.14.55 public build
        run: |
          set -euo pipefail
          touch _site/.nojekyll
          node --check _site/app.js
          node --check _site/road-test-ui.js
          grep -q 'JARVIS-v6.14.55-ROADTEST' _site/index.html
          grep -q 'function jarvisTrackingSnapTarget' _site/app.js
          grep -q 'autoRerouteOffRouteFixes>=3' _site/app.js
          grep -q 'jarvisOnRouteConfirmFixes>=2' _site/app.js
          grep -q 'function jarvisUpdateVehicleBallState' _site/app.js
          grep -q 'v6.14.55 stable vehicle-ball state' _site/app.css
          node -e "const r=require('./_site/redesign-v654-tests.json'); if(!Array.isArray(r.results)||r.results.length!==8||!r.results.every(x=>x.pass===true)) process.exit(1)"
          echo 'JARVIS_V655_PUBLIC_BUILD_OK'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
