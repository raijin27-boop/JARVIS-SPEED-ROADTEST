name: Deploy JARVIS Road Test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble road-test site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          mapfile -d '' appfiles < <(find parts -maxdepth 1 -type f -name 'app.*.txt' -print0 | sort -z)
          : > _site/app.js
          for ((i=0; i<${#appfiles[@]}; i++)); do
            cat "${appfiles[$i]}" >> _site/app.js
            if (( i < ${#appfiles[@]} - 1 )); then printf '\n' >> _site/app.js; fi
          done
          mapfile -d '' htmlfiles < <(find site-parts -maxdepth 1 -type f -name 'index.*.html' -print0 | sort -z)
          : > _site/index.html
          for ((i=0; i<${#htmlfiles[@]}; i++)); do
            cat "${htmlfiles[$i]}" >> _site/index.html
            if (( i < ${#htmlfiles[@]} - 1 )); then printf '\n' >> _site/index.html; fi
          done
          cp app.css road-test-ui.js road-test-fixes.js road-test-start-fix.js road-test-v652.js road-test-v653.js _site/
          touch _site/.nojekyll
          node --check _site/app.js
          node --check _site/road-test-ui.js
          node --check _site/road-test-fixes.js
          node --check _site/road-test-start-fix.js
          node --check _site/road-test-v652.js
          node --check _site/road-test-v653.js
          test -s _site/index.html
          grep -q 'v6.14.53-ROADTEST-20260905A' _site/index.html
          grep -q 'road-test-v653.js' _site/index.html
          grep -q 'ORIGINAL_ROUTE_RESTORED' _site/road-test-v653.js
          grep -q 'V653_FAST_REROUTE' _site/road-test-v653.js
          grep -q 'V653_KEEP_AWAKE_ENFORCE' _site/road-test-v653.js
          grep -q 'longitude:destination.lon' _site/app.js
          test -s _site/road-test-v653.js
          echo "assembled_app_blob=$(git hash-object _site/app.js)"
          echo "JARVIS_SITE_BUILD_OK"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
