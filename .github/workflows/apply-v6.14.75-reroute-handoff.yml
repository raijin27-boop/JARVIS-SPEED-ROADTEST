name: Apply v6.14.75 REROUTE HANDOFF
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.75-reroute-handoff.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply patch
        run: python3 tools/apply-v61475-reroute-handoff.py
      - name: Syntax and safety gates
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq 'v6.14.75 REROUTE HANDOFF' app.js
          grep -Fq 'jarvisRerouteSeedPending=true' app.js
          grep -Fq 'jarvisMotion.displayS=seedS' app.js
          grep -Fq 'const threshold=settling?Math.max(58,AUTO_REROUTE_DISTANCE_M):Math.max(36,Math.min(54,29+acc*.88));' app.js
          grep -Fq 'app.js?v=v6.14.75-0210' index.html
          grep -Fq 'window.__JARVIS_ROAD_TEST_BUILD_ID="v6.14.75-ROADTEST-20260906T0210JST"' index.html
      - name: Commit runtime
        run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: earlier reroute with GPS-seeded handoff v6.14.75'
          git push origin HEAD:main
