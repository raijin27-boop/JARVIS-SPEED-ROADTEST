name: Apply v6.14.77 EARLY VISUAL RELEASE
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.77-early-visual-release.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply patch
        run: python3 tools/apply-v61477-early-visual-release.py
      - name: Syntax and behavior gates
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq 'v6.14.77 EARLY VISUAL RELEASE' app.js
          grep -Fq 'let jarvisPreDeviationVisualFixes=0' app.js
          grep -Fq 'jarvisPreDeviationVisualFixes>=2' app.js
          grep -Fq 'lateral>Math.max(12,acc*1.45)&&mismatch>48' app.js
          grep -Fq 'app.js?v=v6.14.77-0315' index.html
          grep -Fq 'window.__JARVIS_ROAD_TEST_BUILD_ID="v6.14.77-ROADTEST-20260906T0315JST"' index.html
      - name: Commit runtime
        run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: release marker before reroute evidence threshold v6.14.77'
          git push origin HEAD:main
