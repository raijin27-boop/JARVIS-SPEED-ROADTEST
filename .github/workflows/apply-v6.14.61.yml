name: Apply v6.14.61 public corner-leg fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.61.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 tools/apply-v661-public.py
      - run: |
          node --check app.js
          node --check road-test-ui.js
          grep -Fq 'bendStart-approach' app.js
          grep -Fq 'bendEnd+exit' app.js
          grep -Fq 'const exit=approach/2' app.js
          grep -Fq 'v6.14.61-ROADTEST-dev' app.js
      - run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: measure white lines before and after actual bend v6.14.61'
          git push origin HEAD:main
