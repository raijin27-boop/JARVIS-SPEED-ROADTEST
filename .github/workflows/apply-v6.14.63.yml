name: Apply v6.14.63 public white-line fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v6.14.63.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 tools/apply-v663-public.py
      - name: Validate public build
        run: |
          set -euo pipefail
          node --check app.js
          node --check road-test-ui.js
          grep -Fq 'bendStart=Math.max(center-7' app.js
          grep -Fq '(turn.s+next.s)/2-3' app.js
          grep -Fq 'v6.14.63-ROADTEST-dev' app.js
          grep -Fq 'v6.14.63-ROADTEST-20260905T1810JST' index.html
          ! grep -Fq 'v6.14.57-ROADTEST-20260904T222603Z' index.html
      - run: |
          git config user.name jarvis-speed-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: isolate maneuver arrows and correct public build tag v6.14.63'
          git push origin HEAD:main
